name: template-ubuntu-24.04-cloud

# Per-template build->test pipeline. Delegates to the reusable
# _build-test-template.yml so this file stays a thin, badge-bearing entry point.
# Triggers ONLY on changes to this template's own files, plus on demand.
# Shared inputs (build.py, tests/clone-verify.py, _build-test-template.yml,
# builds/linux/{ansible,common}, builds/windows/common) deliberately do NOT
# appear here: they affect several templates, and every template pipeline
# shares the packer-target-environment concurrency group, so a shared-path
# push used to start all nine at once and leave 1 running + 1 pending while
# GitHub CANCELLED the other 7 (seen 2026-09-07, commit 12b4456 -- the Vault
# auth fix was verified on 2 of 9 templates). build-templates.yml now owns
# those paths and dispatches the affected pipelines serially.

on:
  push:
    branches: [main]
    paths:
      - "builds/linux/ubuntu/24.04-cloud/**/*.hcl"
      # ubuntu cloud reuses the ISO ubuntu playbook (../24.04-iso/ansible)
      - "builds/linux/ubuntu/24.04-iso/ansible/**"
      - ".github/workflows/template-ubuntu-24.04-cloud.yml"
  workflow_dispatch:
    inputs:
      build_mode:
        description: "How to handle an existing template/VMID"
        required: false
        default: overwrite
        type: choice
        options:
          - overwrite
          - skip
          - default

permissions:
  contents: read

# Serialize against every other template pipeline, the weekly build-templates
# fan-out: one Proxmox target, shared VMID ranges. Never cancel a
# running build (it would strand a half-built VM at its VMID).
concurrency:
  group: packer-target-environment
  cancel-in-progress: false

jobs:
  build-test:
    uses: ./.github/workflows/_build-test-template.yml
    with:
      build_dir: builds/linux/ubuntu/24.04-cloud
      base_bootstrap_cmd: "python builds/linux/common/scripts/bootstrap-base-template.py"
      build_mode: ${{ inputs.build_mode || 'overwrite' }}
    secrets: inherit
