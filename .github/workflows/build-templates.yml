name: build-templates

# Serial dispatcher for the CLOUD per-template pipelines (template-*-cloud). Two
# jobs: the weekly "rebuild everything" drift check, and — since 2026-09-12 — the
# owner of every SHARED build input, so a change to one is verified across the
# templates it affects instead of self-cancelling eight of them. Dispatches each
# pipeline serially and waits for each, so every template's own badge reflects
# the run. They share the
# packer-target-environment concurrency group and must not overlap, hence the
# serial dispatch. Runs on a GitHub-hosted runner (NOT arc-runners) so it does
# not hold a self-hosted runner that the dispatched builds themselves need.
#
# ISO builds are by-hand only — their template-*-iso workflows are disabled.

on:
  schedule:
    # Sundays 14:00 UTC (09:00 CDT). Clear of the nightly job band.
    - cron: "0 14 * * 0"
  push:
    branches: [main]
    # SHARED inputs live here, not on the per-template pipelines. A change to any
    # of these affects several templates; firing their nine workflows directly
    # would leave 1 running + 1 pending and CANCEL the other 7 (they all share
    # the packer-target-environment group). Routing them here instead dispatches
    # the affected pipelines SERIALLY. Deliberately excludes this file itself: a
    # tweak to the orchestrator should not cost a full nine-template rebuild.
    paths:
      - "builds/linux/ansible/**"
      - "builds/linux/common/**"
      - "builds/windows/common/**"
      - "build.py"
      - "tests/clone-verify.py"
      - ".github/workflows/_build-test-template.yml"
  workflow_dispatch:
    inputs:
      templates:
        description: "Cloud pipeline workflow names to run (space-separated; blank = all 9)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write # dispatch the template-*-cloud workflows

concurrency:
  group: build-templates-fanout
  cancel-in-progress: false

jobs:
  fan-out:
    name: Weekly cloud rebuild (fan-out)
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Dispatch each cloud pipeline serially and wait
        shell: bash
        run: |
          set -uo pipefail
          LINUX="template-rhel-8-cloud template-rhel-9-cloud template-rhel-10-cloud \
                 template-rocky-8-cloud template-rocky-9-cloud template-rocky-10-cloud \
                 template-ubuntu-24.04-cloud"
          WINDOWS="template-windows-2022-cloud template-windows-2025-cloud"
          ALL="$LINUX $WINDOWS"

          wfs="${{ github.event.inputs.templates }}"
          if [ -n "$wfs" ]; then
            echo "Explicit template list from workflow_dispatch."
          elif [ "${{ github.event_name }}" != "push" ]; then
            # schedule, or a dispatch with a blank list: rebuild everything.
            wfs="$ALL"
          else
            # Push to a shared path. Rebuild only the templates that path can
            # actually affect -- a builds/windows/common change has no business
            # spending hours rebuilding seven Linux templates, and vice versa.
            before="${{ github.event.before }}"
            changed=""
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              changed="$(gh api "repos/$REPO/compare/$before...${{ github.sha }}" \
                          --jq '.files[].filename' 2>/dev/null)"
            fi
            if [ -z "$changed" ]; then
              # Force-push, new branch, or a compare the API would not serve.
              # Fail SAFE (rebuild all), never silently skip: an unverified
              # shared change is exactly how two weeks of red went unnoticed.
              echo "::warning::could not determine changed files; rebuilding ALL templates"
              wfs="$ALL"
            else
              echo "Changed files:"; echo "$changed" | sed 's/^/  /'
              if echo "$changed" | grep -qE '^(build\.py|tests/clone-verify\.py|\.github/workflows/_build-test-template\.yml)$'; then
                wfs="$ALL"
              else
                echo "$changed" | grep -qE '^builds/linux/(ansible|common)/' && wfs="$wfs $LINUX"
                echo "$changed" | grep -qE '^builds/windows/common/'          && wfs="$wfs $WINDOWS"
              fi
            fi
          fi

          wfs="$(echo "$wfs" | tr -s ' \n' ' ' | sed 's/^ //;s/ $//')"
          if [ -z "$wfs" ]; then
            echo "No template pipeline is affected by this change; nothing to do."
            exit 0
          fi
          echo "Templates to rebuild: $wfs"
          # SERIAL BY NECESSITY — do not parallelise this loop.
          # There is ONE Proxmox target and the builds share VMID ranges (each
          # build VM lands on the template's own VMID; clone-verify clones into
          # 9600+), so two running at once would collide (VMID clashes, DHCP,
          # resource contention). We dispatch one pipeline, block on it with
          # `gh run watch` until it finishes, then start the next. The shared
          # `packer-target-environment` concurrency group enforces the same rule
          # from the other side: firing all nine at once would leave 1 running +
          # 1 pending and CANCEL the other 7. Parallelism would require multiple
          # Proxmox targets or non-overlapping VMID/clone ranges per template.
          overall=0
          summary=()
          for wf in $wfs; do
            echo "::group::$wf"
            prev="$(gh run list --repo "$REPO" --workflow "$wf.yml" --limit 1 --json databaseId -q '.[0].databaseId // "0"')"
            gh workflow run "$wf.yml" --repo "$REPO"
            # Wait for a NEW run to appear; fail loudly if the dispatch produced
            # none (e.g. GITHUB_TOKEN lacking workflow_dispatch rights -> use a PAT).
            rid=""
            for _ in $(seq 1 20); do
              sleep 6
              cur="$(gh run list --repo "$REPO" --workflow "$wf.yml" --limit 1 --json databaseId -q '.[0].databaseId // "0"')"
              if [ "$cur" != "$prev" ]; then rid="$cur"; break; fi
            done
            if [ -z "$rid" ]; then
              echo "ERROR: no new run for $wf after dispatch (token may lack workflow_dispatch rights)"
              overall=1; summary+=("$wf: NO-RUN"); echo "::endgroup::"; continue
            fi
            gh run watch "$rid" --repo "$REPO" --exit-status >/dev/null 2>&1 || true
            concl="$(gh run view "$rid" --repo "$REPO" --json conclusion -q '.conclusion')"
            echo "$wf -> $concl (run $rid)"
            [ "$concl" = "success" ] || overall=1
            summary+=("$wf: $concl")
            echo "::endgroup::"
          done
          echo "===== SUMMARY ====="
          for s in "${summary[@]}"; do echo "  $s"; done
          exit "$overall"
