name: build-templates

# Weekly "rebuild everything" for drift detection — dispatches each CLOUD
# per-template pipeline (template-*-cloud) serially and waits for each, so every
# template's own badge reflects the weekly run. They share the
# packer-target-environment concurrency group and must not overlap, hence the
# serial dispatch. Runs on a GitHub-hosted runner (NOT arc-runners) so it does
# not hold a self-hosted runner that the dispatched builds themselves need.
#
# ISO builds are by-hand only — their template-*-iso workflows are disabled.

on:
  schedule:
    # Sundays 14:00 UTC (09:00 CDT). Clear of the nightly job band.
    - cron: "0 14 * * 0"
  workflow_dispatch:
    inputs:
      templates:
        description: "Cloud pipeline workflow names to run (space-separated; blank = all 9)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write # dispatch the template-*-cloud workflows

concurrency:
  group: build-templates-fanout
  cancel-in-progress: false

jobs:
  fan-out:
    name: Weekly cloud rebuild (fan-out)
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Dispatch each cloud pipeline serially and wait
        shell: bash
        run: |
          set -uo pipefail
          wfs="${{ github.event.inputs.templates }}"
          if [ -z "$wfs" ]; then
            wfs="template-rhel-8-cloud template-rhel-9-cloud template-rhel-10-cloud \
                 template-rocky-8-cloud template-rocky-9-cloud template-rocky-10-cloud \
                 template-ubuntu-24.04-cloud template-windows-2022-cloud template-windows-2025-cloud"
          fi
          # SERIAL BY NECESSITY — do not parallelise this loop.
          # There is ONE Proxmox target and the builds share VMID ranges (each
          # build VM lands on the template's own VMID; clone-verify clones into
          # 9600+), so two running at once would collide (VMID clashes, DHCP,
          # resource contention). We dispatch one pipeline, block on it with
          # `gh run watch` until it finishes, then start the next. The shared
          # `packer-target-environment` concurrency group enforces the same rule
          # from the other side: firing all nine at once would leave 1 running +
          # 1 pending and CANCEL the other 7. Parallelism would require multiple
          # Proxmox targets or non-overlapping VMID/clone ranges per template.
          overall=0
          summary=()
          for wf in $wfs; do
            echo "::group::$wf"
            prev="$(gh run list --repo "$REPO" --workflow "$wf.yml" --limit 1 --json databaseId -q '.[0].databaseId // "0"')"
            gh workflow run "$wf.yml" --repo "$REPO"
            # Wait for a NEW run to appear; fail loudly if the dispatch produced
            # none (e.g. GITHUB_TOKEN lacking workflow_dispatch rights -> use a PAT).
            rid=""
            for _ in $(seq 1 20); do
              sleep 6
              cur="$(gh run list --repo "$REPO" --workflow "$wf.yml" --limit 1 --json databaseId -q '.[0].databaseId // "0"')"
              if [ "$cur" != "$prev" ]; then rid="$cur"; break; fi
            done
            if [ -z "$rid" ]; then
              echo "ERROR: no new run for $wf after dispatch (token may lack workflow_dispatch rights)"
              overall=1; summary+=("$wf: NO-RUN"); echo "::endgroup::"; continue
            fi
            gh run watch "$rid" --repo "$REPO" --exit-status >/dev/null 2>&1 || true
            concl="$(gh run view "$rid" --repo "$REPO" --json conclusion -q '.conclusion')"
            echo "$wf -> $concl (run $rid)"
            [ "$concl" = "success" ] || overall=1
            summary+=("$wf: $concl")
            echo "::endgroup::"
          done
          echo "===== SUMMARY ====="
          for s in "${summary[@]}"; do echo "  $s"; done
          exit "$overall"
