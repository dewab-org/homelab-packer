name: _build-test-template

# Reusable build->test pipeline for ONE template. Called by the per-template
# workflows (template-*.yml), each of which carries its own status badge. The
# heavy toolchain setup lives here once so the callers stay a few lines.
#
# Flow: ensure the clone-source base exists (self-heal a deleted base) ->
# build the single template (build.py retries + verifies it landed) ->
# clone-verify it (clone, cloud-init, remote login, CA, then destroy).
#
# All callers share the `packer-target-environment` concurrency group (set in
# the caller, top-level) so no two ever touch the single Proxmox target at
# once. cancel-in-progress is false there: killing a build strands a half-made
# VM at its VMID.

on:
  workflow_call:
    inputs:
      build_dir:
        description: "Single build directory, e.g. builds/linux/rhel/10-cloud"
        required: true
        type: string
      base_bootstrap_cmd:
        description: >-
          Command that (re)creates this template's clone-source base. Run only
          when the base is missing. Empty to skip (Windows bases are imported
          out-of-band from a vendor VHDX).
        required: false
        default: ""
        type: string
      build_mode:
        description: "overwrite | skip | default"
        required: false
        default: overwrite
        type: string

permissions:
  contents: read

jobs:
  build-test:
    name: build + clone-test
    runs-on: arc-runners
    timeout-minutes: 300
    env:
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}
      VAULT_CACERT: /tmp/vault-ca.pem
      PACKER_LOG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "1.15.1"

      - name: Install runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates sshpass xorriso openssh-client unzip
          vault_version="1.19.5"
          curl -fsSLo /tmp/vault.zip "https://releases.hashicorp.com/vault/${vault_version}/vault_${vault_version}_linux_amd64.zip"
          sudo unzip -o /tmp/vault.zip vault -d /usr/local/bin
          sudo chmod 0755 /usr/local/bin/vault

      - name: Write Vault CA certificate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.VAULT_CACERT }}" > /tmp/vault-ca.pem
          sudo install -m 0644 /tmp/vault-ca.pem /usr/local/share/ca-certificates/vault-viking-org.crt
          sudo update-ca-certificates

      - name: Log in to Vault (Kubernetes auth)
        shell: bash
        run: |
          set -euo pipefail
          # Kubernetes auth, NOT a stored token. These runners are in-cluster, so
          # they prove who they are with their projected service-account token and
          # Vault hands back a short-lived one. Nothing to rotate, and nothing that
          # can quietly age out in a GitHub secret.
          #
          # That is not hypothetical. This replaced secrets.VAULT_TOKEN, a static
          # token minted 2026-07-27 that died on Vault's default 768h TTL around
          # 2026-08-28. Builds passed on 08-23; every scheduled build from 08-30
          # onward failed at the first Vault read, for two weeks - a red scheduled
          # run nobody watches is indistinguishable from no run at all.
          # Same pattern as homelab.k8s-workloads/.github/workflows/helmfile-apply.yml.
          jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          token="$(vault write -field=token auth/kubernetes/login \
            role=packer-ci jwt="$jwt")"
          echo "::add-mask::$token"
          echo "VAULT_TOKEN=$token" >> "$GITHUB_ENV"
          # Prove the POLICY grants the read, not merely that login returned a
          # token. A token with the wrong policy authenticates perfectly well and
          # then fails at the first secret, deep into the job.
          VAULT_TOKEN="$token" vault kv get -field=PROXMOX_URL secret/packer >/dev/null
          echo "Vault login succeeded and secret/packer is readable."

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Export Proxmox connection from Vault
        shell: bash
        run: |
          set -euo pipefail
          # Same secret packer's vault() reads at build time. Needed here for the
          # base existence check, build.py's post-build verify, and clone-verify.
          for k in PROXMOX_URL PROXMOX_USERNAME PROXMOX_PASSWORD PROXMOX_NODE PROXMOX_STORAGE; do
            v="$(vault kv get -field="$k" secret/packer)"
            echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_ENV"
          done

      - name: Ensure clone-source base exists and is the right size
        shell: bash
        env:
          DISK_TARGET: "60G"
        run: |
          set -euo pipefail
          . .venv/bin/activate
          dir="${{ inputs.build_dir }}"
          cmd="${{ inputs.base_bootstrap_cmd }}"
          if [ -z "$cmd" ]; then
            echo "no base_bootstrap_cmd given; assuming base is present (Windows/manual base)"
            exit 0
          fi
          clone_id="$(grep -oE '^[[:space:]]*clone_vm_id[[:space:]]*=[[:space:]]*[0-9]+' \
            "$dir/variables.auto.pkrvars.hcl" | grep -oE '[0-9]+' | head -1)"
          if [ -z "$clone_id" ]; then
            echo "could not find clone_vm_id in $dir/variables.auto.pkrvars.hcl" >&2
            exit 1
          fi
          # 0=ok/unqueryable, 3=missing, 4=undersized (wrong disk).
          set +e
          python -c "import sys, build; sys.exit(build.base_status('$clone_id', '$DISK_TARGET'))"
          rc=$?
          set -e
          case "$rc" in
            0) echo "clone-source base $clone_id OK; skipping bootstrap" ;;
            3) echo "clone-source base $clone_id MISSING; bootstrapping"; eval "$cmd" ;;
            4) echo "clone-source base $clone_id wrong size; rebuilding at $DISK_TARGET"
               export OVERWRITE_EXISTING=true PROXMOX_BASE_DISK_SIZE="$DISK_TARGET"
               eval "$cmd" ;;
            *) echo "unexpected rc=$rc from base check" >&2; exit 1 ;;
          esac

      - name: Initialize packer plugins
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          ./build.py --init-only "${{ inputs.build_dir }}"

      - name: Build template
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          arg=""
          case "${{ inputs.build_mode }}" in
            overwrite) arg="--overwrite" ;;
            skip)      arg="--skip" ;;
            default)   arg="" ;;
            *) echo "unsupported build_mode: ${{ inputs.build_mode }}" >&2; exit 1 ;;
          esac
          ./build.py $arg "${{ inputs.build_dir }}"

      - name: Clone-verify template
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          vmid="$(python -c "import build,pathlib; print(build.parse_vm_id(pathlib.Path('${{ inputs.build_dir }}/variables.auto.pkrvars.hcl')))")"
          if [ -z "$vmid" ]; then
            echo "could not resolve output vm_id for ${{ inputs.build_dir }}" >&2
            exit 1
          fi
          echo "clone-verifying template $vmid"
          # Destroys every clone it makes (try/finally), including on failure.
          python tests/clone-verify.py "$vmid"

      - name: Notify Matrix on failure
        if: failure()
        shell: bash
        env:
          VAULT_CA: ${{ secrets.VAULT_CACERT }}
          WF: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.build_dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # SELF-CONTAINED ON PURPOSE. This re-writes the CA and logs in to Vault
          # with curl rather than reusing the VAULT_TOKEN or the vault CLI that
          # earlier steps set up. A failure during checkout, apt or pip is exactly
          # the failure most worth hearing about, and a notifier that depends on
          # the steps that just broke is not a notifier.
          #
          # It never fails the job. The job is already red; masking its real cause
          # with a notification error would be worse, so problems here surface as
          # ::error:: annotations and the step still exits 0.
          #
          # Direct Matrix CS API with a per-producer bot, per the estate rule:
          # not the mailrise SMTP bridge, and not hookshot (which renders
          # arbitrary payloads as a raw JSON code block).
          fail() { echo "::error::Matrix notify: $*"; exit 0; }

          printf '%s' "$VAULT_CA" > /tmp/notify-ca.pem
          sa=/var/run/secrets/kubernetes.io/serviceaccount/token
          [ -r "$sa" ] || fail "no projected service-account token at $sa"

          vt="$(curl -sS --cacert /tmp/notify-ca.pem -X POST \
                  --data "{\"role\":\"packer-ci\",\"jwt\":\"$(cat "$sa")\"}" \
                  "$VAULT_ADDR/v1/auth/kubernetes/login" \
                | python3 -c 'import sys,json; print(json.load(sys.stdin)["auth"]["client_token"])' 2>/dev/null)"
          [ -n "$vt" ] || fail "Vault login failed (role=packer-ci)"
          echo "::add-mask::$vt"

          creds="$(curl -sS --cacert /tmp/notify-ca.pem -H "X-Vault-Token: $vt" \
                     "$VAULT_ADDR/v1/secret/data/matrix-bot-github-actions")"
          rd() { printf '%s' "$creds" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['data']['$1'])" 2>/dev/null; }
          tok="$(rd access_token)"; room="$(rd room_id)"; user="$(rd user_id)"
          [ -n "$tok" ] && [ -n "$room" ] && [ -n "$user" ] || fail "could not read secret/matrix-bot-github-actions"
          echo "::add-mask::$tok"

          # Homeserver derived from the bot's own MXID (@github-actions:<server>)
          # instead of hardcoded, so there is one less constant to drift.
          hs="https://${user#*:}"
          room_enc="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$room")"

          # The heredoc is indented to the block scalar's own level: YAML strips
          # exactly that indentation, so python receives it at column 0. Writing
          # it flush-left here would instead END the block scalar.
          body="$(python3 - <<'PY'
          import json, os
          wf, repo = os.environ["WF"], os.environ["REPO"]
          ref, ev, url = os.environ["REF"], os.environ["EVENT"], os.environ["RUN_URL"]
          tgt = os.environ.get("TARGET", "")
          head = wf + (" [" + tgt + "]" if tgt else "")
          plain = "FAILED: " + head + "\n" + repo + " - branch " + ref + ", triggered by " + ev + "\n" + url
          html = ("&#10060; <b>" + head + "</b> failed<br/>"
                  + repo + " &middot; branch <code>" + ref + "</code> &middot; " + ev + "<br/>"
                  + "<a href=\"" + url + "\">" + url + "</a>")
          print(json.dumps({"msgtype": "m.notice", "body": plain,
                            "format": "org.matrix.custom.html", "formatted_body": html}))
          PY
          )"

          # PUT with a transaction id, not POST: the v3 send endpoint is
          # PUT .../send/{eventType}/{txnId}; POST returns M_UNRECOGNIZED.
          code="$(curl -sS -o /tmp/notify-resp.json -w '%{http_code}' \
                    --cacert /tmp/notify-ca.pem -X PUT \
                    -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' \
                    --data "$body" \
                    "$hs/_matrix/client/v3/rooms/$room_enc/send/m.room.message/gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
          if [ "$code" = "200" ]; then
            echo "Matrix notification delivered to #alerts-ci."
          else
            fail "send returned HTTP $code: $(head -c 300 /tmp/notify-resp.json)"
          fi
