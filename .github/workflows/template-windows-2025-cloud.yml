name: template-windows-2025-cloud

# Per-template build->test pipeline. Delegates to the reusable
# _build-test-template.yml so this file stays a thin, badge-bearing entry point.
# Triggers on changes to just this template (plus shared inputs) and on demand.

on:
  push:
    branches: [main]
    paths:
      - "builds/windows/windows-server-2025-desktop-experience-cloud/**"
      - "builds/windows/common/**"
      - "build.py"
      - "tests/clone-verify.py"
      - ".github/workflows/_build-test-template.yml"
      - ".github/workflows/template-windows-2025-cloud.yml"
  workflow_dispatch:
    inputs:
      build_mode:
        description: "How to handle an existing template/VMID"
        required: false
        default: overwrite
        type: choice
        options:
          - overwrite
          - skip
          - default

permissions:
  contents: read

# Serialize against every other template pipeline, the weekly build-templates,
# and verify-templates: one Proxmox target, shared VMID ranges. Never cancel a
# running build (it would strand a half-built VM at its VMID).
concurrency:
  group: packer-target-environment
  cancel-in-progress: false

jobs:
  build-test:
    uses: ./.github/workflows/_build-test-template.yml
    with:
      build_dir: builds/windows/windows-server-2025-desktop-experience-cloud
      build_mode: ${{ inputs.build_mode || 'overwrite' }}
    secrets: inherit
