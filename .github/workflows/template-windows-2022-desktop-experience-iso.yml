name: template-windows-2022-desktop-experience-iso

# Windows ISO build for one template. Since 2026-09-13 this IS the Windows
# path: the VHD-based "cloud" pipelines were retired because their 2021 Azure
# eval bases could no longer take the current cumulative update. Dispatched by
# build-templates.yml (weekly, and on shared-input pushes) - never on push or
# schedule here, since a full Windows Setup + Windows Update is ~2h. Run
# `./build.py --overwrite builds/windows/windows-server-2022-desktop-experience-iso`
# locally for the same thing; build.py builds at a scratch VMID and swaps on success.

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "How to handle an existing template/VMID"
        required: false
        default: overwrite
        type: choice
        options:
          - overwrite
          - skip
          - default

permissions:
  contents: read

concurrency:
  group: packer-target-environment
  cancel-in-progress: false

jobs:
  build-test:
    uses: ./.github/workflows/_build-test-template.yml
    with:
      build_dir: builds/windows/windows-server-2022-desktop-experience-iso
      build_mode: ${{ inputs.build_mode || 'overwrite' }}
    secrets: inherit
