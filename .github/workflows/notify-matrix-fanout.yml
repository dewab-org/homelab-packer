name: notify-matrix-fanout

# The weekly fan-out (build-templates) runs on a GitHub-hosted runner ON PURPOSE
# -- see the comment at the top of build-templates.yml: it must not occupy a
# self-hosted runner that the builds it dispatches need. A GitHub-hosted runner
# has no route to matrix.lab.local, so that workflow cannot announce its own
# failure the way the others do. This watcher runs afterwards, on arc-runners,
# and does it for them.
#
# The dispatched template-*-cloud pipelines each notify for themselves, so this
# is not about their failures. It closes the one gap they cannot cover: the
# fan-out failing WITHOUT dispatching anything - a bad input, a permissions
# change, an API error - which means no builds ran at all and, without this,
# nothing would say so.
#
# workflow_run only fires for workflows on the default branch, which is exactly
# where the schedule runs.

on:
  workflow_run:
    workflows: ["build-templates"]
    types: [completed]

permissions:
  contents: read
  actions: read # to ask whether the cancelled run ever actually started

jobs:
  notify:
    name: Announce fan-out failure
    # failure OR cancelled. A cancelled fan-out is usually the outcome worth
    # hearing about: a job that hits its timeout-minutes, or (before 09-12, when
    # this was one job) the 6h hosted-runner cap, both end `cancelled`, and on
    # 09-12 this watcher SKIPPED exactly that because it only looked for
    # `failure`. But `cancelled` also covers a run that never started at all -
    # GitHub keeps one pending run per concurrency group, so two merges seconds
    # apart cancel the first before it does anything. The step below asks the
    # API whether any job actually ran and stays quiet if none did.
    if: contains(fromJSON('["failure","cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: arc-runners
    timeout-minutes: 10
    env:
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}
    steps:
      - name: Notify Matrix
        shell: bash
        env:
          VAULT_CA: ${{ secrets.VAULT_CACERT }}
          WF: build-templates (weekly fan-out)
          STATUS: ${{ github.event.workflow_run.conclusion }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
          RUN_UPDATED: ${{ github.event.workflow_run.updated_at }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
          TARGET: ""
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -uo pipefail
          # Same self-contained shape as the step in _build-test-template.yml.
          # Nothing here depends on a checkout, so a broken repo state cannot
          # silence the notification.
          fail() { echo "::error::Matrix notify: $*"; exit 1; }

          # Did the cancelled run ever DO anything? GitHub keeps one pending run
          # per concurrency group, so a run superseded by a newer push is
          # "cancelled" with zero jobs started. That is routine, not an incident,
          # and paging on it would teach people to ignore this room. Ask the API
          # for the run's jobs; if none has a started_at, stay quiet.
          export DURATION="unknown duration"
          if [ "$STATUS" = "cancelled" ]; then
            jobs="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")"
            started="$(printf '%s' "$jobs" | python3 -c 'import sys,json; print(sum(1 for j in json.load(sys.stdin).get("jobs",[]) if j.get("started_at")))' 2>/dev/null || echo "?")"
            if [ "$started" = "0" ]; then
              echo "fan-out run $RUN_ID was cancelled before any job started (superseded by a newer push, or cancelled while queued) - nothing to announce."
              exit 0
            fi
            echo "cancelled run $RUN_ID had $started job(s) that started - announcing."
          fi
          DURATION="$(python3 -c '
          import os, datetime as d
          try:
              p = lambda s: d.datetime.fromisoformat(s.replace("Z", "+00:00"))
              secs = int((p(os.environ["RUN_UPDATED"]) - p(os.environ["RUN_STARTED"])).total_seconds())
              print(f"{secs // 3600}h {secs % 3600 // 60:02d}m")
          except Exception:
              print("unknown duration")')"
          export DURATION

          printf '%s' "$VAULT_CA" > /tmp/notify-ca.pem
          sa=/var/run/secrets/kubernetes.io/serviceaccount/token
          [ -r "$sa" ] || fail "no projected service-account token at $sa"

          vt="$(curl -sS --cacert /tmp/notify-ca.pem -X POST \
                  --data "{\"role\":\"packer-ci\",\"jwt\":\"$(cat "$sa")\"}" \
                  "$VAULT_ADDR/v1/auth/kubernetes/login" \
                | python3 -c 'import sys,json; print(json.load(sys.stdin)["auth"]["client_token"])' 2>/dev/null)"
          [ -n "$vt" ] || fail "Vault login failed (role=packer-ci)"
          echo "::add-mask::$vt"

          creds="$(curl -sS --cacert /tmp/notify-ca.pem -H "X-Vault-Token: $vt" \
                     "$VAULT_ADDR/v1/secret/data/matrix-bot-github-actions")"
          rd() { printf '%s' "$creds" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['data']['$1'])" 2>/dev/null; }
          tok="$(rd access_token)"; room="$(rd room_id)"; user="$(rd user_id)"
          [ -n "$tok" ] && [ -n "$room" ] && [ -n "$user" ] || fail "could not read secret/matrix-bot-github-actions"
          echo "::add-mask::$tok"

          hs="https://${user#*:}"
          room_enc="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$room")"

          body="$(python3 - <<'PY'
          import json, os
          wf, repo = os.environ["WF"], os.environ["REPO"]
          ref, ev, url = os.environ["REF"], os.environ["EVENT"], os.environ["RUN_URL"]
          status = os.environ.get("STATUS", "failure")
          dur = os.environ.get("DURATION", "unknown duration")
          if status == "cancelled":
              # Do not assert a cause; give the reader what distinguishes them.
              why = ("Cancelled after " + dur + " with at least one template job started. "
                     "Close to 6h00m on a hosted runner means the hard cap; otherwise someone "
                     "or something cancelled it, and later pipelines in the serial list were "
                     "never dispatched.")
          else:
              why = "Failed after " + dur + ". No templates may have been built at all."
          plain = (status.upper() + ": " + wf + "\n" + repo + " - branch " + ref + ", triggered by " + ev
                   + "\n" + why + "\n" + url)
          html = ("&#10060; <b>" + wf + "</b> " + status + "<br/>"
                  + repo + " &middot; branch <code>" + ref + "</code> &middot; " + ev + "<br/>"
                  + "<i>" + why + "</i><br/>"
                  + "<a href=\"" + url + "\">" + url + "</a>")
          print(json.dumps({"msgtype": "m.notice", "body": plain,
                            "format": "org.matrix.custom.html", "formatted_body": html}))
          PY
          )"

          code="$(curl -sS -o /tmp/notify-resp.json -w '%{http_code}' \
                    --cacert /tmp/notify-ca.pem -X PUT \
                    -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' \
                    --data "$body" \
                    "$hs/_matrix/client/v3/rooms/$room_enc/send/m.room.message/gha-fanout-${{ github.event.workflow_run.id }}")"
          if [ "$code" = "200" ]; then
            echo "Matrix notification delivered to #alerts-ci."
          else
            fail "send returned HTTP $code: $(head -c 300 /tmp/notify-resp.json)"
          fi
