---
- name: Verify Cloud-Init package is installed
  ansible.builtin.command: rpm -q cloud-init  # noqa: command-instead-of-module
  changed_when: false

- name: Enable Cloud-Init service
  ansible.builtin.systemd:
    name: cloud-init
    enabled: true

- name: Install custom CA certificates
  ansible.builtin.copy:
    content: "{{ lookup('community.hashi_vault.hashi_vault', 'secret/data/ca auth_method=token validate_certs=False')['bundle'] }}"
    dest: /etc/pki/ca-trust/source/anchors/homelab-ca-bundle.pem
    owner: root
    group: root
    mode: "0644"

- name: Install lab CA certificates from web mirror
  ansible.builtin.get_url:
    url: "https://web.viking.org/tmp/certs/{{ item }}"
    dest: "/etc/pki/ca-trust/source/anchors/{{ item }}"
    owner: root
    group: root
    mode: "0644"
    validate_certs: false
  loop:
    - root_ca.crt
    - intermediate_ca.crt

- name: Update CA trust store
  ansible.builtin.command: update-ca-trust
  changed_when: true

- name: Ensure hardware clock is interpreted as UTC
  ansible.builtin.command: timedatectl set-local-rtc 0
  changed_when: true

- name: Enable chronyd
  ansible.builtin.systemd:
    name: chronyd
    enabled: true

- name: Enable chrony-wait so boot-ordered units can require synced time
  ansible.builtin.systemd:
    name: chrony-wait
    enabled: true

- name: Find SSH host keys
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: "ssh_host_*key*"
    file_type: file
  register: ssh_host_keys

- name: Remove SSH host keys
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ssh_host_keys.files }}"

- name: Reset machine-id
  ansible.builtin.copy:
    content: ""
    dest: /etc/machine-id
    owner: root
    group: root
    mode: "0444"

- name: Ensure machine-id file exists
  ansible.builtin.file:
    path: /etc/machine-id
    state: touch
    owner: root
    group: root
    mode: "0444"

- name: Remove dbus machine-id
  ansible.builtin.file:
    path: /var/lib/dbus/machine-id
    state: absent

- name: Ensure dbus directory exists
  ansible.builtin.file:
    path: /var/lib/dbus
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Link dbus machine-id to /etc/machine-id
  ansible.builtin.file:
    src: /etc/machine-id
    dest: /var/lib/dbus/machine-id
    state: link

# Re-arm cloud-init so every clone treats its first boot as first boot.
#
# This task previously deleted /var/lib/cloud/instance-id and
# /var/lib/cloud/instance-id.old — paths cloud-init has NEVER used (the real
# state lives in /var/lib/cloud/data/, instances/, sem/ and seed/). It ran
# green on every build while doing nothing, and the template shipped with the
# build's instance-id cached in /var/lib/cloud/data/instance-id. Because
# Proxmox derives the clone's NoCloud instance-id the same way it did during
# the build, cloud-init saw "previous iid == current iid" on the clone's first
# boot and SKIPPED every per-instance module: no user, no password, no
# hostname. Proven with a linked clone of rhel-9-cloud: ciuser was never
# created and the clone kept the build VM's hostname.
#
# `cloud-init clean` is the canonical re-arm: it empties /var/lib/cloud
# (including the seed/ dir, which can shadow the Proxmox drive) and, with
# --logs, removes the build's logs so a clone's first boot is debuggable.
- name: Re-arm cloud-init (clean state, seed and logs)
  ansible.builtin.command: cloud-init clean --logs --seed
  changed_when: true

- name: Verify cloud-init state is actually gone   # trust nothing
  ansible.builtin.stat:
    path: /var/lib/cloud/data/instance-id
  register: ci_instance_id
  failed_when: ci_instance_id.stat.exists

- name: Remove persistent net rules
  ansible.builtin.file:
    path: /etc/udev/rules.d/70-persistent-net.rules
    state: absent
