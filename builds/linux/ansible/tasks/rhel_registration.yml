---
- name: Show registration configuration
  ansible.builtin.debug:
    msg:
      - "satellite_configured={{ satellite_configured }}"
      - "satellite_certificate_configured={{ satellite_certificate_configured }}"
      - "satellite_host={{ satellite_host }}"
      - "satellite_environment={{ satellite_environment | default('') }}"
      - "satellite_username_set={{ (satellite_username | length) > 0 }}"
      - "satellite_password_set={{ (satellite_password | length) > 0 }}"
      - "redhat_username_set={{ (redhat_username | length) > 0 }}"
      - "redhat_password_set={{ (redhat_password | length) > 0 }}"

- name: Validate registration inputs
  ansible.builtin.assert:
    that:
      - satellite_configured or ((redhat_username | length) > 0 and (redhat_password | length) > 0)
      - not satellite_configured or ((satellite_username | length) > 0 and (satellite_password | length) > 0)
    fail_msg: Missing required Red Hat registration inputs from Vault.

- name: Ensure DNS resolvers for registration
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      search lab.local viking.org
      {% for nameserver in registration_nameservers %}
      nameserver {{ nameserver }}
      {% endfor %}

- name: Download Satellite Certificate RPM
  ansible.builtin.get_url:
    url: "{{ satellite_certificate_url }}"
    dest: /tmp/katello-ca-consumer-latest.noarch.rpm
    mode: "0644"
    validate_certs: false
  register: satellite_cert_dl
  until: satellite_cert_dl is succeeded
  retries: "{{ rhel_net_retries }}"
  delay: "{{ rhel_net_delay }}"
  when: satellite_certificate_configured

- name: Install Satellite Certificate RPM
  ansible.builtin.dnf:
    name: /tmp/katello-ca-consumer-latest.noarch.rpm
    state: present
    disable_gpg_check: true
  when: satellite_certificate_configured

- name: Register against Red Hat Satellite Server
  community.general.redhat_subscription:
    server_hostname: "{{ satellite_host }}"
    username: "{{ satellite_username }}"
    password: "{{ satellite_password }}"
    auto_attach: "{{ satellite_auto_attach | default(omit) }}"
    environment: "{{ satellite_environment }}"
    force_register: true
  register: satellite_reg
  until: satellite_reg is succeeded
  retries: "{{ rhel_net_retries }}"
  delay: "{{ rhel_net_delay }}"
  no_log: true
  when: satellite_configured

- name: Register against Red Hat Network
  community.general.redhat_subscription:
    username: "{{ redhat_username }}"
    password: "{{ redhat_password }}"
    force_register: true
  register: rhn_reg
  until: rhn_reg is succeeded
  retries: "{{ rhel_net_retries }}"
  delay: "{{ rhel_net_delay }}"
  no_log: true
  when: not satellite_configured

- name: Update DNF metadata
  ansible.builtin.dnf:
    update_cache: true
  register: rhel_dnf_meta
  until: rhel_dnf_meta is succeeded
  retries: "{{ rhel_net_retries }}"
  delay: "{{ rhel_net_delay }}"

# Fully patch while still registered, so clones ship up to date. Must run
# before the unregister tasks below (no repos once unregistered).
- name: Upgrade all packages at build time
  ansible.builtin.import_tasks: system_upgrade.yml

# Unregister (Satellite or RHN — `subscription-manager unregister` covers both)
# AND confirm the identity is gone, with retries. A tolerated single-shot
# unregister swallows a real failure: the template ships still-registered (every
# clone shares one RHSM identity) and each failed build leaks an orphaned
# registration into the account. Loop unregister+clean until identity reports
# nothing, or fail the build.
- name: Unregister from RHSM and confirm the identity is gone
  ansible.builtin.shell: |
    subscription-manager unregister || true
    subscription-manager clean || true
    if subscription-manager identity >/dev/null 2>&1; then exit 1; fi
    exit 0
  args:
    executable: /bin/bash
  register: rhsm_unregister
  changed_when: rhsm_unregister.rc == 0
  retries: "{{ rhel_net_retries }}"
  delay: "{{ rhel_net_delay }}"
  until: rhsm_unregister.rc == 0

- name: Remove unused packages
  ansible.builtin.dnf:
    autoremove: true

- name: Clean package manager caches
  ansible.builtin.command: dnf clean all
  changed_when: true
